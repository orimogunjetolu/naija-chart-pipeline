# Runs the pipeline every day for free on GitHub and commits the new data.
name: daily-chart-pipeline
on:
  schedule:
    - cron: "17 7 * * *"   # 07:17 UTC daily
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python run_pipeline.py
      - name: Commit new data
        run: |
          git config user.name "chart-bot"
          git config user.email "chart-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: chart for $(date -u +%F)"
          git push
